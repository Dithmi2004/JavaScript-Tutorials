<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Js in HTML</title>

    <!-- internal/embeded js -->
    <script>
        console.log("Internal JS");
    </script>

    <!-- External js -->
    <script src="script.js"></script>
</head>

<body>
    <h1>Add JS to HTML</h1>

    <!-- Inline js -->
    <button onclick="console.log('Inline JS')">
        Click Me
    </button>
</body>

</html>
