<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables and Operations</title>

    <script>
        // var
        var name = 'Kamal';
        console.log(name);

        name = 'Ruwan';
        console.log(name);
        
        // let
        let age = 24;
        console.log(age);

        age = 22;
        console.log(age);

        // const
        const role = 'Manager';
        console.log(role);

        role = 'HR';
        console.log(role);
    </script>
</head>

<body>
    <h1>
        Variables and Operations
    </h1>
</body>

</html>
