<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Types</title>
    <script>
        // data types
        let myString = "John";
        let myNumber = 22;
        let myBoolean = false;
        let myNull = null;
        let myUndefined = undefined;
        let myObject = {name: "Kamal", age: 25};
        let myArray = [1,2,3,4];
        let myFunction = function(){
            console.log("Test");
        };


        // check data type

        console.log(typeof myString);
        console.log(typeof myNumber);
        console.log(typeof myArray);
        console.log(typeof myBoolean);
        console.log(typeof myFunction);

        console.log(typeof 4.75);
    </script>
</head>

<body>
    <h1>Types</h1>
</body>

</html>
